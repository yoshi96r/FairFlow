services:
  # === PRODUCTION STACK ===
  - type: web
    name: fairflow-api
    env: node
    plan: starter
    buildCommand: |
      corepack enable
      pnpm i --filter @fairflow/api...
      pnpm --filter @fairflow/api prisma migrate deploy
      pnpm --filter @fairflow/api build
    startCommand: node apps/api/dist/server.js
    autoDeploy: false
    domains:
      - api.fairflowlogistics.com
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fairflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: fairflow-web
    env: node
    plan: starter
    buildCommand: |
      corepack enable
      pnpm i --filter @fairflow/web...
      pnpm --filter @fairflow/web build
    startCommand: pnpm --filter @fairflow/web start
    autoDeploy: false
    domains:
      - app.fairflowlogistics.com
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: API_URL
        value: https://api.fairflowlogistics.com
      - key: NEXT_PUBLIC_API_URL
        value: https://api.fairflowlogistics.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://api.fairflowlogistics.com

  # === STAGING STACK ===
  - type: web
    name: fairflow-api-staging
    env: node
    plan: starter
    buildCommand: |
      corepack enable
      pnpm i --filter @fairflow/api...
      pnpm --filter @fairflow/api prisma migrate deploy
      pnpm --filter @fairflow/api build
    startCommand: node apps/api/dist/server.js
    autoDeploy: true
    domains:
      - staging-api.fairflowlogistics.com
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fairflow-db-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: fairflow-web-staging
    env: node
    plan: starter
    buildCommand: |
      corepack enable
      pnpm i --filter @fairflow/web...
      pnpm --filter @fairflow/web build
    startCommand: pnpm --filter @fairflow/web start
    autoDeploy: true
    domains:
      - staging.fairflowlogistics.com
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: API_URL
        value: https://staging-api.fairflowlogistics.com
      - key: NEXT_PUBLIC_API_URL
        value: https://staging-api.fairflowlogistics.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://staging-api.fairflowlogistics.com

databases:
  - name: fairflow-db
    plan: starter
    databaseName: fairflow
    user: fairflow
    ipAllowList: []

  - name: fairflow-db-staging
    plan: starter
    databaseName: fairflow_staging
    user: fairflow_staging
    ipAllowList: []

